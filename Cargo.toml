[package]
name = "tabdance-elvish-tree-sitter"
description = "Elvish and Elvish transcript grammars for the tree-sitter parsing library"
version = "0.0.0-PLACEHOLDER"
keywords = ["incremental", "parsing", "elvish", "elvish-transcript"]
categories = ["parsing", "text-editors"]
repository = "https://github.com/tab-dance/tabdance-elvish-tree-sitter"
edition = "2018"
license = "0BSD"

build = "bindings/rust/build.rs"
include = [
  "bindings/rust/*",
  "elvish/grammar.js",
  "elvish/src/*",
  "elvish/queries/*",
  "elvish_transcript/grammar.js",
  "elvish_transcript/src/*",
  "elvish_transcript/queries/*",
  "tree-sitter.json",
  "LICENSE",
]

[lib]
path = "bindings/rust/lib.rs"

[dependencies]
tree-sitter-language = "0.1"

[dev-dependencies]
tree-sitter = "0.26"

[build-dependencies]
cc = "1.0"
