# SPDX-License-Identifier: 0BSD
name: Build

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install Node dependencies
        run: npm install --ignore-scripts

      - name: Install tree-sitter CLI binary
        working-directory: node_modules/tree-sitter-cli
        run: node install.js

      - name: Verify parser generation is up to date
        run: |
          npx tree-sitter generate --abi 14 elvish/grammar.js -o elvish/src
          npx tree-sitter generate --abi 14 elvish_transcript/grammar.js -o elvish_transcript/src
          if ! git diff --quiet -- elvish/src elvish_transcript/src; then
            echo "Generated parser files are out of date. Run generate for both grammars."
            git --no-pager diff -- elvish/src elvish_transcript/src
            exit 1
          fi

      - name: Run tree-sitter tests
        run: npm test

      - name: Validate package metadata
        run: node scripts/check-metadata.mjs

      - name: Validate tree-sitter queries
        run: node scripts/check-queries.mjs

      - name: Build Node binding
        run: npx node-gyp rebuild

      - name: Test Node binding
        run: npm run test:node

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Cargo test
        run: cargo test

      - name: Cargo fmt (check)
        run: cargo fmt --check

      - name: Cargo clippy
        run: cargo clippy -- -D warnings
