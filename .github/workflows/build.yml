name: Build

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Node dependencies
        run: npm install

      - name: Verify parser generation is up to date
        run: |
          npx tree-sitter generate --abi 14
          if ! git diff --quiet -- src/parser.c src/grammar.json src/node-types.json; then
            echo "Generated parser files are out of date. Run: npx tree-sitter generate --abi 14"
            git --no-pager diff -- src/parser.c src/grammar.json src/node-types.json
            exit 1
          fi

      - name: Run tree-sitter tests
        run: npx tree-sitter test

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Cargo test
        run: cargo test

      - name: Cargo fmt (check)
        run: cargo fmt --check

      - name: Cargo clippy
        run: cargo clippy -- -D warnings